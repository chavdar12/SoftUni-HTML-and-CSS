name: Validate HTML

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx --yes html-validate@11.21.1 --config .github/linters/.htmlvalidate.json "**/*.html"
